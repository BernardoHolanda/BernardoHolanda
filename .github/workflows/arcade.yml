name: Gerar animação do arcade

on:

  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Gerar o SVG do jogo
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga'

      - name: Publicar no branch arcade-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: arcade-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
